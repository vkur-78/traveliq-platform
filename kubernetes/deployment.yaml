# ==============================================================================
# TRAVELIQ — Flight Price Prediction API Deployment
# Image matches docker/Dockerfile -> traveliq-flight-api:2.0 (port 5001)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveliq-flight-api
  labels:
    app: traveliq-flight-api
    app.kubernetes.io/part-of: traveliq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traveliq-flight-api
  template:
    metadata:
      labels:
        app: traveliq-flight-api
        app.kubernetes.io/part-of: traveliq
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: traveliq-flight-api
          image: traveliq-flight-api:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: traveliq-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 5001
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
