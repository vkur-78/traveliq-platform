# ==============================================================================
# TRAVELIQ — Horizontal Pod Autoscalers (autoscaling/v2)
# Requires metrics-server enabled in the Kubernetes cluster.
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traveliq-flight-api-hpa
  labels:
    app: traveliq-flight-api
    app.kubernetes.io/part-of: traveliq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traveliq-flight-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traveliq-gender-api-hpa
  labels:
    app: traveliq-gender-api
    app.kubernetes.io/part-of: traveliq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traveliq-gender-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
