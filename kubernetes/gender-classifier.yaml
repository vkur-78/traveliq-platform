# ==============================================================================
# TRAVELIQ — Lightweight Gender Classification API Deployment & Service
# Image matches gender/Dockerfile -> traveliq-gender-api:2.0 (port 5002)
# Uses the 40.4 KB Phase 1 pure scikit-learn pipeline (no PyTorch overhead).
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveliq-gender-api
  labels:
    app: traveliq-gender-api
    app.kubernetes.io/part-of: traveliq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traveliq-gender-api
  template:
    metadata:
      labels:
        app: traveliq-gender-api
        app.kubernetes.io/part-of: traveliq
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: traveliq-gender-api
          image: traveliq-gender-api:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: traveliq-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 5002
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: traveliq-gender-api
  labels:
    app: traveliq-gender-api
    app.kubernetes.io/part-of: traveliq
spec:
  type: NodePort
  selector:
    app: traveliq-gender-api
  ports:
    - name: http
      protocol: TCP
      port: 5002
      targetPort: 5002
      nodePort: 30502
