# ==============================================================================
# TRAVELIQ — Optional External Credentials Secret Template
#
# Local / SQLite MLflow deployments do NOT require any secrets.
# Use this template ONLY if connecting MLflow to an external cloud database
# (e.g., managed PostgreSQL) or private object storage (S3/GCS).
#
# Never commit real secret values to Git. Create via kubectl instead:
#   kubectl create secret generic traveliq-external-secrets \
#     --from-literal=MLFLOW_BACKEND_STORE_URI='postgresql://...'
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: traveliq-external-secrets
  labels:
    app.kubernetes.io/part-of: traveliq
type: Opaque
stringData:
  MLFLOW_BACKEND_STORE_URI: "REPLACE_WITH_EXTERNAL_DB_URI_IF_USED"
  MLFLOW_TRACKING_TOKEN: "REPLACE_WITH_TOKEN_IF_AUTH_ENABLED"
