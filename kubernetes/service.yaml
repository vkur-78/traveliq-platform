# ==============================================================================
# TRAVELIQ — Flight Price Prediction API Service (Port 5001)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: traveliq-flight-api
  labels:
    app: traveliq-flight-api
    app.kubernetes.io/part-of: traveliq
spec:
  type: NodePort
  selector:
    app: traveliq-flight-api
  ports:
    - name: http
      protocol: TCP
      port: 5001
      targetPort: 5001
      nodePort: 30501
