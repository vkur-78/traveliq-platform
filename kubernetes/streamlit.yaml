# ==============================================================================
# TRAVELIQ — Streamlit Web Application Deployment & Service
# Image matches docker/Dockerfile.streamlit -> traveliq-streamlit:2.0 (port 8501)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveliq-streamlit
  labels:
    app: traveliq-streamlit
    app.kubernetes.io/part-of: traveliq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traveliq-streamlit
  template:
    metadata:
      labels:
        app: traveliq-streamlit
        app.kubernetes.io/part-of: traveliq
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: traveliq-streamlit
          image: traveliq-streamlit:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: traveliq-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: traveliq-streamlit
  labels:
    app: traveliq-streamlit
    app.kubernetes.io/part-of: traveliq
spec:
  type: NodePort
  selector:
    app: traveliq-streamlit
  ports:
    - name: http
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30851
