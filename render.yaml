# TRAVELIQ — Render Free Blueprint (2 Decoupled Flask REST Microservices, $0 / No Credit Card)
# Pairs with Streamlit Community Cloud ($0 / 2.7 GB RAM) hosting streamlit_app.py over HTTPS.
# MLflow admin UI is intentionally NOT deployed publicly.

services:
  - type: web
    name: traveliq-flight-api
    runtime: docker
    dockerfilePath: ./deploy/cloud/Dockerfile.flight
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MLFLOW_TRACKING_URI
        value: disabled
      - key: ENABLE_LOCAL_MODEL_FALLBACK
        value: "1"
      - key: MODEL_NAME
        value: Voyage_Flight_Price_Model
      - key: MODEL_ALIAS
        value: champion

  - type: web
    name: traveliq-gender-api
    runtime: docker
    dockerfilePath: ./deploy/cloud/Dockerfile.gender
    dockerContext: .
    plan: free
    healthCheckPath: /health
